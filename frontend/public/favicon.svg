<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 앱 배경과 동일한 따뜻한 다크 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D1916"/>
      <stop offset="100%" stop-color="#13100D"/>
    </linearGradient>
    <!-- 왼쪽 페이지: 골드 → 앰버 -->
    <linearGradient id="lp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C96A"/>
      <stop offset="100%" stop-color="#D4854A"/>
    </linearGradient>
    <!-- 오른쪽 페이지: 앰버 → 번트 -->
    <linearGradient id="rp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4854A"/>
      <stop offset="100%" stop-color="#A0622E"/>
    </linearGradient>
    <!-- 내부 테두리 -->
    <linearGradient id="bdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C56A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4854A" stop-opacity="0.12"/>
    </linearGradient>
    <!-- 앰버 글로우 -->
    <radialGradient id="glow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#D4854A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D4854A" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A0806" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect width="100" height="100" rx="22" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="21" fill="none"
        stroke="url(#bdr)" stroke-width="1.5"/>

  <!-- 책 본체 -->
  <g filter="url(#sh)">
    <path d="M50,26 L16,24 Q12,24 12,28 L12,73 Q12,77 16,77 L50,75 Z" fill="url(#lp)"/>
    <path d="M50,26 L84,24 Q88,24 88,28 L88,73 Q88,77 84,77 L50,75 Z" fill="url(#rp)"/>
  </g>

  <!-- 상단 shimmer -->
  <path d="M50,26 L16,24 Q12,24 12,28 L12,31.5 Q12,27.5 15.5,27.5 L50,29.5 Z"
        fill="rgba(255,240,200,0.28)"/>
  <path d="M50,26 L84,24 Q88,24 88,28 L88,31.5 Q88,27.5 84.5,27.5 L50,29.5 Z"
        fill="rgba(255,240,200,0.18)"/>

  <!-- 왼쪽 페이지 라인 -->
  <line x1="17" y1="38" x2="47" y2="37" stroke="rgba(237,232,226,0.32)" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="17" y1="47" x2="47" y2="46" stroke="rgba(237,232,226,0.22)" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="17" y1="56" x2="47" y2="55" stroke="rgba(237,232,226,0.13)" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="17" y1="65" x2="37" y2="64" stroke="rgba(237,232,226,0.07)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 오른쪽 페이지 라인 -->
  <line x1="53" y1="37" x2="83" y2="38" stroke="rgba(237,232,226,0.32)" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="53" y1="46" x2="83" y2="47" stroke="rgba(237,232,226,0.22)" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="53" y1="55" x2="83" y2="56" stroke="rgba(237,232,226,0.13)" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="53" y1="64" x2="73" y2="65" stroke="rgba(237,232,226,0.07)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 척추 곡선 -->
  <path d="M50,26 C48.5,50.5 51.5,50.5 50,75"
        fill="none" stroke="rgba(237,232,226,0.55)" stroke-width="1.6" stroke-linecap="round"/>
</svg>
