<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 아이티센 블루 3-블레이드 핀휠 심볼 -->
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16224F"/>
      <stop offset="100%" stop-color="#26418F"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E4FCB"/>
      <stop offset="100%" stop-color="#2F6FED"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F8FEF"/>
      <stop offset="100%" stop-color="#5CB2FF"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B1220" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="#FFFFFF"/>

  <g filter="url(#sh)">
    <path d="M50,50 C30,50 18,38 20,22 C21,12 32,6 46,8 C60,10 66,20 64,32 C63,40 58,46 50,50 Z" fill="url(#p1)"/>
    <path d="M50,50 C30,50 18,38 20,22 C21,12 32,6 46,8 C60,10 66,20 64,32 C63,40 58,46 50,50 Z" fill="url(#p2)" transform="rotate(120 50 50)"/>
    <path d="M50,50 C30,50 18,38 20,22 C21,12 32,6 46,8 C60,10 66,20 64,32 C63,40 58,46 50,50 Z" fill="url(#p3)" transform="rotate(240 50 50)"/>
  </g>
</svg>
