<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1D36"/>
      <stop offset="100%" stop-color="#0C0A09"/>
    </linearGradient>
    <linearGradient id="chr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow" cx="38%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- 블루 글로우 -->
  <rect width="100" height="100" rx="22" fill="url(#glow)"/>
  <!-- 안쪽 테두리 (입체감) -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="21" fill="none"
        stroke="url(#bdr)" stroke-width="1.5"/>

  <!-- 똑 모노그램 -->
  <text x="50" y="70"
    font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif"
    font-size="58" font-weight="900" text-anchor="middle"
    fill="url(#chr)">똑</text>
</svg>
